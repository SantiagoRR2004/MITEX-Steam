name: Update videogames.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs at midnight (12:00 AM) every day

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.12" # Latest stable version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas tqdm

      - name: Run dataAcquisition.py
        run: python dataAcquisition.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ! git diff --quiet; then
            git add .
            git commit -m "chore: Update videogames.json [GitHub Action]"
            git push
          else
            echo "No changes to push."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
